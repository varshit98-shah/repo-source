<div class="auth-container">
  <div class="auth-card">
    <a routerLink="/login" class="back-btn" title="Back to Login">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div class="auth-header">
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a 6-digit OTP to reset your password.</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com"
          [class.is-invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" />
        <div class="error-message" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          <span *ngIf="forgotForm.get('email')?.hasError('required')">Email is required.</span>
          <span *ngIf="forgotForm.get('email')?.hasError('email')">Please enter a valid email.</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Send OTP</span>
        <span *ngIf="isLoading()" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Remember your password? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
