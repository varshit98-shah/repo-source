<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Create an Account</h2>
      <p>Join us today! Please fill in your details.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      
      <!-- Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" formControlName="name" placeholder="John Doe"
          [class.is-invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" />
        <div class="error-message" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
          <span *ngIf="registerForm.get('name')?.hasError('required')">Name is required.</span>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com"
          [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" />
        <div class="error-message" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <span *ngIf="registerForm.get('email')?.hasError('required')">Email is required.</span>
          <span *ngIf="registerForm.get('email')?.hasError('email')">Please enter a valid email.</span>
        </div>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" type="text" formControlName="phone" placeholder="1234567890"
          [class.is-invalid]="registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched" />
        <div class="error-message" *ngIf="registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched">
          <span *ngIf="registerForm.get('phone')?.hasError('required')">Phone is required.</span>
          <span *ngIf="registerForm.get('phone')?.hasError('pattern')">Must be a valid 10-digit number.</span>
        </div>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label for="address">Address</label>
        <input id="address" type="text" formControlName="address" placeholder="123 Main St"
          [class.is-invalid]="registerForm.get('address')?.invalid && registerForm.get('address')?.touched" />
        <div class="error-message" *ngIf="registerForm.get('address')?.invalid && registerForm.get('address')?.touched">
          <span *ngIf="registerForm.get('address')?.hasError('required')">Address is required.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••"
            [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" />
          <button type="button" class="toggle-password" (click)="togglePassword()" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <div class="error-message" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <span *ngIf="registerForm.get('password')?.hasError('required')">Password is required.</span>
          <span *ngIf="registerForm.get('password')?.hasError('minlength')">Must be at least 6 characters.</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Register</span>
        <span *ngIf="isLoading()" class="spinner"></span>
      </button>

    </form>

    <div class="register-footer">
      <p>Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
