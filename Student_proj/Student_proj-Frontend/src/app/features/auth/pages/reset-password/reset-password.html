<div class="auth-container">
  <div class="auth-card">
    <a routerLink="/forgot-password" class="back-btn" title="Back to Forgot Password">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div class="auth-header">
      <h2>Reset Password</h2>
      <p *ngIf="emailToReset">We sent an OTP to <strong>{{emailToReset}}</strong></p>
      <p *ngIf="!emailToReset" class="text-danger">Warning: No email found. Please go back.</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="otp">6-Digit OTP</label>
        <input id="otp" type="text" formControlName="otp" placeholder="123456" maxlength="6"
          inputmode="numeric" pattern="[0-9]*" (keypress)="allowOnlyNumbers($event)"
          [class.is-invalid]="resetForm.get('otp')?.invalid && resetForm.get('otp')?.touched" />
        <div class="error-message" *ngIf="resetForm.get('otp')?.invalid && resetForm.get('otp')?.touched">
          <span *ngIf="resetForm.get('otp')?.hasError('required')">OTP is required.</span>
          <span *ngIf="resetForm.get('otp')?.hasError('minlength')">OTP must be exactly 6 digits.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="password-input-wrapper">
          <input id="newPassword" [type]="showPassword() ? 'text' : 'password'" formControlName="newPassword" placeholder="••••••••"
            [class.is-invalid]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched" />
          <button type="button" class="toggle-password" (click)="togglePassword()" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
        <div class="error-message" *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          <span *ngIf="resetForm.get('newPassword')?.hasError('required')">New password is required.</span>
          <span *ngIf="resetForm.get('newPassword')?.hasError('minlength')">Must be at least 6 characters.</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading() || !emailToReset">
        <span *ngIf="!isLoading()">Update Password</span>
        <span *ngIf="isLoading()" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Did not receive the OTP? <a routerLink="/forgot-password">Try again</a></p>
    </div>
  </div>
</div>
