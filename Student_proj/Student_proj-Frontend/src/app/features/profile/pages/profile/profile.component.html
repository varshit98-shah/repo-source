<div class="form-wrapper" style="max-width: 600px; margin: 0 auto; padding: 2rem;">
  <div class="form-card" style="background: var(--card-bg); padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div class="form-header" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
      <h2 style="margin: 0; color: var(--text-color);">My Profile</h2>
      <p style="margin: 0.5rem 0 0; color: var(--text-muted);">View and update your personal information.</p>
    </div>

    <div *ngIf="isLoading()" class="loading-state" style="text-align: center; padding: 2rem;">
      <div class="spinner" style="margin: 0 auto 1rem; width: 40px; height: 40px; border: 4px solid var(--border-color); border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="color: var(--text-muted);">Loading profile data...</p>
    </div>

    <form *ngIf="!isLoading()" [formGroup]="profileForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="name" style="font-weight: 500; color: var(--text-color);">Full Name</label>
        <input id="name" type="text" formControlName="name" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--sidebar-bg); color: var(--text-color);" />
        <div *ngIf="profileForm.get('name')?.invalid && profileForm.get('name')?.touched" style="color: #ef4444; font-size: 0.875rem;">
          <span *ngIf="profileForm.get('name')?.hasError('required')">Name is required.</span>
        </div>
      </div>

      <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="email" style="font-weight: 500; color: var(--text-color);">Email Address</label>
        <input id="email" type="email" formControlName="email" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--sidebar-bg); color: var(--text-color);" />
        <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched" style="color: #ef4444; font-size: 0.875rem;">
          <span *ngIf="profileForm.get('email')?.hasError('required')">Email is required.</span>
          <span *ngIf="profileForm.get('email')?.hasError('email')">Please enter a valid email.</span>
        </div>
      </div>

      <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="phone" style="font-weight: 500; color: var(--text-color);">Phone Number</label>
        <div style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; background: var(--sidebar-bg);">
          <span style="padding: 0.75rem; background: var(--card-bg); border-right: 1px solid var(--border-color); color: var(--text-muted);">+91</span>
          <input id="phone" type="text" formControlName="phone" style="border: none; outline: none; padding: 0.75rem; flex: 1; background: transparent; color: var(--text-color);" />
        </div>
        <div *ngIf="profileForm.get('phone')?.invalid && profileForm.get('phone')?.touched" style="color: #ef4444; font-size: 0.875rem;">
          <span *ngIf="profileForm.get('phone')?.hasError('required')">Phone is required.</span>
          <span *ngIf="profileForm.get('phone')?.hasError('pattern')">Must be a valid 10-digit number.</span>
        </div>
      </div>

      <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="address" style="font-weight: 500; color: var(--text-color);">Address</label>
        <input id="address" type="text" formControlName="address" style="padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--sidebar-bg); color: var(--text-color);" />
        <div *ngIf="profileForm.get('address')?.invalid && profileForm.get('address')?.touched" style="color: #ef4444; font-size: 0.875rem;">
          <span *ngIf="profileForm.get('address')?.hasError('required')">Address is required.</span>
        </div>
      </div>

      <div class="form-actions" style="margin-top: 1rem;">
        <button type="submit" [disabled]="isSubmitting() || profileForm.invalid" style="width: 100%; padding: 0.75rem; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
          <span *ngIf="!isSubmitting()">Save Changes</span>
          <div *ngIf="isSubmitting()" class="spinner" style="width: 20px; height: 20px; border: 2px solid white; border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </button>
      </div>

    </form>
  </div>
</div>
