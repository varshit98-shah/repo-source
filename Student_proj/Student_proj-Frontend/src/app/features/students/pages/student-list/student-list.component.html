<div class="list-container">
  <div class="header-section">
    <div>
      <h2>Students Management</h2>
      <p>Manage all registered students in the system.</p>
    </div>
    <button *ngIf="canCreate()" class="add-btn" routerLink="/students/new">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Add Student
    </button>
  </div>

  <div class="table-card">
    <div *ngIf="isLoading()" class="loading-state">
      <div class="spinner"></div>
      <p>Loading students...</p>
    </div>

    <table *ngIf="!isLoading() && students().length > 0" class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th *ngIf="canUpdate() || canDelete()" class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let student of students()">
          <td>#{{ student.id }}</td>
          <td class="font-medium">{{ student.name }}</td>
          <td>{{ student.email }}</td>
          <td>{{ student.phone }}</td>
          <td *ngIf="canUpdate() || canDelete()" class="actions-col">
            <button *ngIf="canUpdate()" class="icon-btn edit" (click)="editStudent(student.id)" title="Edit">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button *ngIf="canDelete()" class="icon-btn delete" (click)="deleteStudent(student.id)" title="Delete">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!isLoading() && students().length === 0" class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <p>No students found.</p>
    </div>
  </div>
</div>
