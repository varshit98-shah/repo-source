<div class="carddiv">
    <div class="card-header">
        <h1>Counter App</h1>
    </div>
    <h2 class="card-title">Count: {{counter()}}</h2>
    <div class="btn-group">
        <button (click)="increment()">+</button>
        <button (click)="reset()">reset</button>
        <button (click)="decrement()">-</button>
    </div>
</div>
