<ul>
    <li>Name:{{ userdetail?.UserName}}</li>
    <li>Email:{{ userdetail?.Email}}</li>
    <li>Gender:{{ userdetail?.Gender}}</li>
    <li>Bio:{{ userdetail?.UserBio}}</li>
</ul>
<form #userform="ngForm" (ngSubmit)="adduser(userform.value)">
    <input type="text" name ="UserName" placeholder="Enter User Name"ngModel>
    <br>
    <br>
    <input type="password" name="Password" placeholder="Enter Password"ngModel>
    <br>
    <br>
    <input type="email" name="Email" placeholder="Enter Email"ngModel>
    <br>
    <br>
    <select name="Gender" id="" ngModel>
        <option value="">Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>
    <br>
    <br>
    <textarea name="UserBio" id="" ngModel></textarea>
    <br>
    <br>
    <button>Add User</button>

</form>
